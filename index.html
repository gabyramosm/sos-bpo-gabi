<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOS BPO · Gabi — Soporte IT LATAM</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div class="app-wrapper">
    <div class="chat-container">

      <!-- ── Header ─────────────────────────────────────────── -->
      <header class="chat-header">
        <img src="assets/gabi-avatar.svg" alt="Gabi" class="chat-header__avatar" />
        <div class="chat-header__info">
          <div class="chat-header__name">SOS BPO · Gabi</div>
          <div class="chat-header__status">● En línea · Soporte IT LATAM</div>
        </div>
        <div class="chat-header__actions">
          <span class="badge-ia">✨ IA activa</span>
          <button class="btn-metrics" id="btnOpenMetrics" aria-label="Ver métricas">
            Ver métricas
          </button>
        </div>
      </header>

      <!-- ── Área de mensajes ───────────────────────────────── -->
      <main class="chat-messages" id="chatMessages" role="log" aria-live="polite">
      </main>

      <!-- ── Banner casos de uso demo (oculto hasta que termina el onboarding) -->
      <div class="demo-banner" id="demoBanner" style="display:none">
        <button class="demo-banner__close" id="btnCloseDemoBanner" aria-label="Cerrar">×</button>
        <div class="demo-banner__title">✨ Probá estos casos reales con IA</div>
        <div class="demo-cases">

          <button class="demo-case" onclick="triggerDemoCase('Cambié de celular y no puedo acceder con IBM Verify. No me llega el código de verificación.')">
            <span class="demo-case__icon">📱</span>
            <span class="demo-case__title">Cambio de celular</span>
            <span class="demo-case__desc">IBM Verify no funciona después de cambiar el teléfono</span>
          </button>

          <button class="demo-case" onclick="triggerDemoCase('Soy nueva en IBM, es mi primer día y no sé qué aplicaciones instalar ni cómo configurar el equipo.')">
            <span class="demo-case__icon">🆕</span>
            <span class="demo-case__title">Usuario nuevo</span>
            <span class="demo-case__desc">Primer día — configuración completa del equipo</span>
          </button>

          <button class="demo-case" onclick="triggerDemoCase('Al encender mi notebook Lenovo me aparece una pantalla azul que me pide una clave de recuperación de 48 números.')">
            <span class="demo-case__icon">🔒</span>
            <span class="demo-case__title">BitLocker bloqueado</span>
            <span class="demo-case__desc">Pantalla azul pidiendo clave de recuperación</span>
          </button>

        </div>
      </div>

      <!-- ── Entrada de texto ───────────────────────────────── -->
      <footer class="chat-input-area">
        <input
          type="text"
          class="chat-input"
          id="chatInput"
          placeholder="Escribí tu consulta o elegí una opción…"
          autocomplete="off"
          aria-label="Mensaje"
        />
        <button class="btn-send" id="btnSend" aria-label="Enviar mensaje">
          <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path d="M2.5 2.5l15 7.5-15 7.5V12l10-2-10-2V2.5z"/>
          </svg>
        </button>
      </footer>

    </div><!-- /chat-container -->
  </div><!-- /app-wrapper -->

  <!-- ── Modal de Métricas ──────────────────────────────────── -->
  <div class="modal-overlay" id="metricsModal" role="dialog" aria-modal="true" aria-labelledby="metricsTitle">
    <div class="modal">
      <div class="modal__header">
        <span class="modal__title" id="metricsTitle">📊 Métricas de Gabi</span>
        <button class="modal__close" id="btnCloseMetrics" aria-label="Cerrar métricas">×</button>
      </div>
      <div class="modal__body" id="metricsBody"></div>
      <div class="modal__footer">
        <button class="btn-secondary" id="btnResetMetrics">Resetear métricas</button>
        <button class="btn-secondary" id="btnCloseMetrics2" aria-label="Cerrar métricas">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- ── Scripts ────────────────────────────────────────────── -->
  <script src="js/flows.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/metrics.js"></script>
  <script src="js/app.js"></script>

  <script>
    // Cerrar banner sin onclick inline
    document.getElementById('btnCloseDemoBanner').addEventListener('click', function () {
      document.getElementById('demoBanner').style.display = 'none';
    });
    function triggerDemoCase(message) {
      document.getElementById('demoBanner').style.display = 'none';
      var input = document.getElementById('chatInput');
      var btn   = document.getElementById('btnSend');
      if (input && btn && !input.disabled) {
        input.value = message;
        btn.click();
      }
    }
  </script>

</body>
</html>
